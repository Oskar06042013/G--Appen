<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: keep important content within safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#2ee59d" />
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.26)" />
      <stop offset="1" stop-color="rgba(255,255,255,0.00)" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".22" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="160" fill="url(#bg)" />
  <path d="M72 128 C 210 44, 302 58, 440 150" fill="none" stroke="url(#shine)" stroke-width="36" opacity="0.95" />

  <!-- Inner shield (safe zone) -->
  <path
    d="M256 118
       C 332 118, 388 154, 402 220
       C 420 306, 356 382, 256 408
       C 156 382, 92 306, 110 220
       C 124 154, 180 118, 256 118 Z"
    fill="rgba(11,16,32,0.30)"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="2"
  />

  <!-- Route -->
  <path
    d="M140 336 C 196 308, 230 282, 256 252 C 292 212, 332 198, 380 178"
    fill="none"
    stroke="rgba(255,255,255,0.72)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-dasharray="2 26"
    opacity="0.95"
  />

  <!-- Footprint -->
  <g filter="url(#soft)" fill="rgba(255,255,255,0.92)" transform="translate(2 4)">
    <path
      d="M192 320
         C 180 304, 186 282, 204 272
         C 224 260, 246 270, 256 292
         C 266 314, 258 336, 236 344
         C 214 352, 202 340, 192 320 Z"
      opacity="0.95"
    />
    <circle cx="210" cy="258" r="6" />
    <circle cx="226" cy="254" r="5.6" />
    <circle cx="242" cy="258" r="5.2" />
    <circle cx="254" cy="270" r="5.0" />
  </g>

  <!-- School + flag -->
  <g transform="translate(288 150) scale(0.95)" filter="url(#soft)">
    <path d="M0 82 L70 42 L140 82 L140 154 L0 154 Z" fill="rgba(255,255,255,0.90)" />
    <rect x="54" y="106" width="32" height="48" rx="10" fill="rgba(11,16,32,0.30)" />
    <path d="M70 14 L70 60" stroke="rgba(255,255,255,0.95)" stroke-width="8" stroke-linecap="round" />
    <path d="M70 14 L96 26" stroke="rgba(255,77,109,0.98)" stroke-width="8" stroke-linecap="round" />
  </g>

  <text
    x="176"
    y="208"
    text-anchor="middle"
    font-family="system-ui, Segoe UI, Roboto, Arial"
    font-size="64"
    font-weight="900"
    fill="rgba(6,16,35,0.78)"
  >
    GA
  </text>
</svg>

