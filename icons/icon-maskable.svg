<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: keep important content within safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#2ee59d" />
    </linearGradient>
    <linearGradient id="path" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.60)" />
      <stop offset="1" stop-color="rgba(255,255,255,0.10)" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".22" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="160" fill="url(#bg)" />
  <circle cx="256" cy="270" r="190" fill="rgba(11,16,32,0.22)" />

  <!-- Path -->
  <path
    d="M128 378 C 196 332, 228 306, 252 270 C 286 220, 320 210, 392 182"
    fill="none"
    stroke="url(#path)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-dasharray="2 28"
    opacity="0.9"
  />

  <!-- Footprints (kept inside safe zone) -->
  <g fill="rgba(255,255,255,0.90)" filter="url(#soft)" transform="translate(0 6)">
    <ellipse cx="204" cy="336" rx="17" ry="24" transform="rotate(-18 204 336)" />
    <circle cx="188" cy="304" r="6.2" />
    <circle cx="201" cy="295" r="5.7" />
    <circle cx="216" cy="297" r="5.2" />
    <circle cx="227" cy="308" r="5.0" />

    <ellipse cx="258" cy="296" rx="17" ry="24" transform="rotate(16 258 296)" />
    <circle cx="276" cy="264" r="6.2" />
    <circle cx="260" cy="256" r="5.7" />
    <circle cx="244" cy="259" r="5.2" />
    <circle cx="232" cy="270" r="5.0" />
  </g>

  <!-- School (inside safe zone) -->
  <g transform="translate(292 154) scale(0.92)" filter="url(#soft)">
    <path d="M0 72 L70 32 L140 72 L140 152 L0 152 Z" fill="rgba(255,255,255,0.88)" />
    <path d="M70 24 L18 58 L18 152 L122 152 L122 58 Z" fill="rgba(255,255,255,0.82)" />
    <rect x="56" y="98" width="28" height="54" rx="8" fill="rgba(11,16,32,0.26)" />
    <rect x="28" y="80" width="22" height="18" rx="6" fill="rgba(11,16,32,0.20)" />
    <rect x="90" y="80" width="22" height="18" rx="6" fill="rgba(11,16,32,0.20)" />
    <path d="M70 8 L70 38" stroke="rgba(255,255,255,0.90)" stroke-width="8" stroke-linecap="round" />
    <path d="M70 8 L92 18" stroke="rgba(255,77,109,0.95)" stroke-width="8" stroke-linecap="round" />
  </g>

  <text
    x="156"
    y="198"
    text-anchor="middle"
    font-family="system-ui, Segoe UI, Roboto, Arial"
    font-size="74"
    font-weight="900"
    fill="rgba(6,16,35,0.70)"
  >
    G�
  </text>
</svg>

