<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#2ee59d" />
    </linearGradient>
    <linearGradient id="path" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.65)" />
      <stop offset="1" stop-color="rgba(255,255,255,0.10)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35" />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".22" />
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="56" y="56" width="400" height="400" rx="140" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Dark glass center -->
  <circle cx="256" cy="260" r="178" fill="rgba(11,16,32,0.22)" />

  <!-- Curved path (walk-to-school) -->
  <path
    d="M146 350 C 200 310, 230 290, 252 260 C 280 220, 305 210, 360 188"
    fill="none"
    stroke="url(#path)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-dasharray="2 26"
    opacity="0.9"
  />

  <!-- Footprints -->
  <g fill="rgba(255,255,255,0.90)" filter="url(#soft)">
    <!-- left -->
    <ellipse cx="198" cy="322" rx="16" ry="22" transform="rotate(-18 198 322)" />
    <circle cx="184" cy="293" r="6" />
    <circle cx="196" cy="284" r="5.5" />
    <circle cx="210" cy="286" r="5" />
    <circle cx="220" cy="296" r="4.8" />

    <!-- right -->
    <ellipse cx="246" cy="286" rx="16" ry="22" transform="rotate(16 246 286)" />
    <circle cx="262" cy="257" r="6" />
    <circle cx="248" cy="250" r="5.5" />
    <circle cx="234" cy="252" r="5" />
    <circle cx="224" cy="262" r="4.8" />
  </g>

  <!-- Simple school building -->
  <g transform="translate(305 146)" filter="url(#soft)">
    <path d="M0 70 L70 30 L140 70 L140 150 L0 150 Z" fill="rgba(255,255,255,0.88)" />
    <path d="M70 22 L16 56 L16 150 L124 150 L124 56 Z" fill="rgba(255,255,255,0.82)" />
    <rect x="56" y="96" width="28" height="54" rx="8" fill="rgba(11,16,32,0.26)" />
    <rect x="26" y="78" width="22" height="18" rx="6" fill="rgba(11,16,32,0.20)" />
    <rect x="92" y="78" width="22" height="18" rx="6" fill="rgba(11,16,32,0.20)" />
    <path d="M70 6 L70 36" stroke="rgba(255,255,255,0.90)" stroke-width="8" stroke-linecap="round" />
    <path d="M70 6 L92 16" stroke="rgba(255,77,109,0.95)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Small monogram -->
  <text
    x="150"
    y="190"
    text-anchor="middle"
    font-family="system-ui, Segoe UI, Roboto, Arial"
    font-size="72"
    font-weight="900"
    fill="rgba(6,16,35,0.70)"
  >
    G�
  </text>
</svg>

